<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">LOD Selection at Different Viewing Distances</text>
  
  <!-- Pan-Arctic View -->
  <g transform="translate(100, 150)">
    <text x="0" y="-95" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">Pan-Arctic View</text>
    <text x="0" y="-80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">~2000 km altitude</text>
    
    <!-- Map frame -->
    <rect x="-75" y="-65" width="150" height="120" fill="#e8f4f8" stroke="#3498db" stroke-width="2" rx="3"/>
    
    <!-- Simplified coastline -->
    <path d="M -75 -20 Q -50 -30 -20 -25 Q 10 -20 30 -35 Q 50 -50 75 -40" fill="none" stroke="#2c3e50" stroke-width="1.5"/>
    <path d="M -75 10 Q -40 5 0 15 Q 40 25 75 10" fill="none" stroke="#2c3e50" stroke-width="1.5"/>
    
    <!-- Circle location (subpixel - shown as dot) -->
    <circle cx="15" cy="-10" r="3" fill="#e74c3c"/>
    <line x1="20" y1="-15" x2="45" y2="-40" stroke="#e74c3c" stroke-width="1"/>
    <text x="47" y="-42" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">1km circle</text>
    <text x="47" y="-32" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">(subpixel)</text>
    
    <!-- LOD indicator -->
    <rect x="-70" y="35" width="140" height="18" fill="#27ae60" rx="2"/>
    <text x="0" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">LOD 0: 3 vertices (triangle)</text>
  </g>
  
  <!-- Regional View -->
  <g transform="translate(300, 150)">
    <text x="0" y="-95" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">Regional View</text>
    <text x="0" y="-80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">~50 km altitude</text>
    
    <!-- Map frame -->
    <rect x="-75" y="-65" width="150" height="120" fill="#e8f4f8" stroke="#3498db" stroke-width="2" rx="3"/>
    
    <!-- Simplified coastline -->
    <path d="M -75 20 Q -30 10 0 25 Q 40 40 75 30" fill="none" stroke="#2c3e50" stroke-width="1.5"/>
    
    <!-- Circle (small but visible) -->
    <polygon points="0,-25 15,-10 10,8 -10,8 -15,-10" fill="rgba(231,76,60,0.3)" stroke="#e74c3c" stroke-width="2"/>
    
    <!-- LOD indicator -->
    <rect x="-70" y="35" width="140" height="18" fill="#3498db" rx="2"/>
    <text x="0" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">LOD 2: 24 vertices</text>
  </g>
  
  <!-- Local View -->
  <g transform="translate(500, 150)">
    <text x="0" y="-95" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">Local View</text>
    <text x="0" y="-80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">~500 m altitude</text>
    
    <!-- Map frame -->
    <rect x="-75" y="-65" width="150" height="120" fill="#e8f4f8" stroke="#3498db" stroke-width="2" rx="3"/>
    
    <!-- Circle (large, smooth) -->
    <circle cx="0" cy="-5" r="50" fill="rgba(231,76,60,0.3)" stroke="#e74c3c" stroke-width="2"/>
    
    <!-- LOD indicator -->
    <rect x="-70" y="35" width="140" height="18" fill="#9b59b6" rx="2"/>
    <text x="0" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">LOD 3: 72 vertices</text>
  </g>
  
  <!-- Detail View -->
  <g transform="translate(700, 150)">
    <text x="0" y="-95" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">Detail View</text>
    <text x="0" y="-80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">~10 m altitude</text>
    
    <!-- Map frame -->
    <rect x="-75" y="-65" width="150" height="120" fill="#e8f4f8" stroke="#3498db" stroke-width="2" rx="3"/>
    
    <!-- Circle edge (zoomed in, showing curvature) -->
    <path d="M -75 40 Q 0 -60 75 40" fill="rgba(231,76,60,0.3)" stroke="#e74c3c" stroke-width="3"/>
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">edge of circle</text>
    
    <!-- LOD indicator -->
    <rect x="-70" y="35" width="140" height="18" fill="#e67e22" rx="2"/>
    <text x="0" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">LOD 5: 648 vertices</text>
  </g>
  
  <!-- Zoom level indicator bar -->
  <g transform="translate(400, 280)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Viewing Distance Scale</text>
    
    <!-- Scale bar -->
    <rect x="-300" y="15" width="600" height="20" fill="#ecf0f1" stroke="#bdc3c7" rx="3"/>
    
    <!-- Gradient fill -->
    <defs>
      <linearGradient id="distGradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#27ae60"/>
        <stop offset="25%" style="stop-color:#3498db"/>
        <stop offset="50%" style="stop-color:#9b59b6"/>
        <stop offset="75%" style="stop-color:#e67e22"/>
        <stop offset="100%" style="stop-color:#e74c3c"/>
      </linearGradient>
    </defs>
    <rect x="-298" y="17" width="596" height="16" fill="url(#distGradient)" rx="2"/>
    
    <!-- Distance markers -->
    <line x1="-300" y1="40" x2="-300" y2="50" stroke="#2c3e50" stroke-width="1"/>
    <text x="-300" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">5000km</text>
    
    <line x1="-150" y1="40" x2="-150" y2="50" stroke="#2c3e50" stroke-width="1"/>
    <text x="-150" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">500km</text>
    
    <line x1="0" y1="40" x2="0" y2="50" stroke="#2c3e50" stroke-width="1"/>
    <text x="0" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">50km</text>
    
    <line x1="150" y1="40" x2="150" y2="50" stroke="#2c3e50" stroke-width="1"/>
    <text x="150" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">500m</text>
    
    <line x1="300" y1="40" x2="300" y2="50" stroke="#2c3e50" stroke-width="1"/>
    <text x="300" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">1m</text>
    
    <!-- Arrow -->
    <text x="-350" y="28" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">FAR</text>
    <text x="320" y="28" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">NEAR</text>
  </g>
  
  <!-- LOD transitions note -->
  <g transform="translate(400, 380)">
    <rect x="-250" y="-10" width="500" height="80" fill="#fff" stroke="#ddd" rx="5"/>
    <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">LOD Transition Points (switch distances)</text>
    
    <text x="-200" y="35" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">LOD 0→1: ~29 km</text>
    <text x="-50" y="35" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">LOD 1→2: ~4.5 km</text>
    <text x="100" y="35" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">LOD 2→3: ~500 m</text>
    
    <text x="-200" y="55" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">LOD 3→4: ~56 m</text>
    <text x="-50" y="55" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">LOD 4→5: ~6 m</text>
    <text x="100" y="55" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">(LOD 5 is leaf tile)</text>
  </g>
</svg>

